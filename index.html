<style>
:root{
  --bg:#121016; --panel:#1c1922; --panel2:#25212d; --line:#3a3444;
  --text:#ece6dc; --muted:#a59cad; --gold:#d9b46a; --gold2:#f0d79c;
  --red:#d2554d; --green:#6fbf8a; --blue:#7aa7d9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  background:radial-gradient(ellipse at top,#2a2030 0%,var(--bg) 60%) fixed;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0 0 .4em;line-height:1.2}
h1{font-size:2.2rem;color:var(--gold2);letter-spacing:.5px}
h2{font-size:1.5rem;color:var(--gold2)}
h3{font-size:1.1rem;color:var(--gold)}
p{margin:.4em 0 .9em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;margin:10px 0;
  font:600 1.05rem Inter,sans-serif;cursor:pointer;background:var(--gold);color:#1a1410;
  -webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.small{padding:10px;font-size:.95rem}
.row{display:flex;gap:10px}.row>*{flex:1}
.scen{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;
  margin:8px 0;cursor:pointer;background:var(--panel2)}
.scen.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.scen .ic{font-size:2rem}
.chip{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:99px;margin:4px 4px 0 0;cursor:pointer}
.chip.sel{border-color:var(--gold);color:var(--gold2)}
input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit}
.namerow{display:flex;align-items:center;gap:10px;margin:8px 0}
.namerow .lab{width:44%;font-weight:600}
.story p{font-family:Georgia,serif;font-size:1.05rem}
.role{border-radius:14px;padding:16px;margin:12px 0;text-align:center}
.role.murd{background:linear-gradient(135deg,#4a1717,#2a0f12);border:1px solid var(--red)}
.role.wit{background:linear-gradient(135deg,#1d3550,#141f2e);border:1px solid var(--blue)}
.role.det{background:linear-gradient(135deg,#1f3a2a,#14231a);border:1px solid var(--green)}
.role .big{font-family:"Playfair Display",serif;font-size:1.8rem;font-weight:800}
.fact{padding:10px 12px;border-left:3px solid var(--gold);background:var(--panel2);border-radius:0 10px 10px 0;margin:8px 0}
.fact.red{border-color:var(--red)}.fact.blue{border-color:var(--blue)}.fact.green{border-color:var(--green)}
.timer{font-family:"Playfair Display",serif;font-size:4.2rem;text-align:center;color:var(--gold2);margin:8px 0 0;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:var(--gold)}
.pick{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin:8px 0;
  cursor:pointer;background:var(--panel2);font-weight:600}
.pick .ic{font-size:1.7rem}
.qr{display:flex;justify-content:center;background:#fff;padding:12px;border-radius:12px;width:max-content;margin:10px auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.modal{position:fixed;inset:0;background:rgba(5,4,8,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .panel{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.pub{padding:10px 0;border-top:1px solid var(--line)}
.tags{margin:4px 0}.tag{display:inline-block;font-size:.82rem;padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);margin:2px 4px 2px 0}
.fact.gold{border-color:var(--gold2);background:#2e2718}
ol{padding-left:1.2em}li{margin:.3em 0}
</style>
</head>

/* ===================== Game generation (pure, deterministic) ===================== */
function rngFrom(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickOne(arr,r){return arr[Math.floor(r()*arr.length)]}

function generate(seed, scId){
  const sc = SCENARIOS.find(s=>s.id===scId) || SCENARIOS[0];
  const r = rngFrom(seed);
  const seats=[0,1,2,3];
  const murderer = Math.floor(r()*4);
  const others = shuffle(seats.filter(s=>s!==murderer), r);
  const witness = others[0];
  const dets = [others[1], others[2]];
  const innocents = seats.filter(s=>s!==murderer);

  // clue order: k0 public at half time (murderer knows it), k1 -> dets[0], k2 -> dets[1]
  const clueOrder = shuffle([0,1,2], r);
  // murder values per category, and public appearance values for everyone
  const mv = [0,1,2].map(()=>Math.floor(r()*3));
  let vals;
  for(let tries=0;tries<2000;tries++){
    vals = seats.map(s => s===murderer ? mv.slice() : [0,1,2].map(()=>Math.floor(r()*3)));
    const m = (s,c)=>vals[s][c]===mv[c];
    const noFull = innocents.every(s=>!(m(s,0)&&m(s,1)&&m(s,2)));
    const herrings = [0,1,2].every(c=>innocents.some(s=>m(s,c)));
    const detsNeedHalf = innocents.some(s=>m(s,clueOrder[1])&&m(s,clueOrder[2]));
    if(noFull && herrings && detsNeedHalf) break;
  }

  // locations: innocents get distinct secret locations, murderer was at the crime scene
  const locOrder = shuffle([0,1,2,3,4], r);
  const loc = {}; innocents.forEach((s,i)=>loc[s]=locOrder[i]);
  loc[murderer] = -1;
  const alibi = locOrder[3];

  // sightings: everyone saw one innocent (not themselves) heading to where they really were
  const sight = {};
  seats.forEach(s=>{ sight[s] = pickOne(innocents.filter(x=>x!==s), r); });

  return {sc, seedBase:seed>>>0, murderer, witness, dets, vals, mv, clueOrder, loc, alibi, sight};
}

/* ===================== Card text ===================== */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function who(g,names,s){const c=g.sc.chars[s];const n=(names&&names[s]||"").trim();return n?`${n} (${c.name})`:c.name}
function roleOf(g,s){return s===g.murderer?"murd":s===g.witness?"wit":"det"}
function clueText(g,k){return g.sc.cats[k].vals[g.mv[k]].clue}
function secretOf(g,s){return g.sc.locs[s===g.murderer?g.alibi:g.loc[s]].secret}

// public knowledge: what everybody can see and knows about everyone
function publicHTML(g,names){
  const sc=g.sc;
  return `<div class="panel"><h3>👀 Amit mindenki lát és tud</h3>

      <div class="tags">${sc.cats.map((cat,i)=>`<span class="tag">${esc(cat.label)}: <b>${esc(cat.vals[g.vals[s][i]].v)}</b></span>`).join("")}</div>
      <div class="small">🗣️ ${esc(c.rumor)}</div>
      <div class="small">🔑 ${esc(c.access)}</div></div>`).join("")}
  </div>`;
}

function cardHTML(g,names,s){
  const sc=g.sc, c=sc.chars[s], role=roleOf(g,s);
  const R={murd:["Gyilkos","Te ölted meg. Senki nem tudja. Még."],
           wit:["Szemtanú","Ártatlan vagy, és tudod a választ."],
           det:["Nyomozó","Ártatlan vagy. Találd meg a gyilkost."]}[role];
  const col={murd:"red",wit:"blue",det:"green"}[role];
  let h=`<div class="center"><div style="font-size:3rem">${c.icon}</div><h2>${esc(who(g,names,s))}</h2>
    <p class="muted small">${esc(c.bio)}</p></div>
    <div class="role ${role}"><div class="small">A szereped</div><div class="big">${R[0]}</div><div class="small">${R[1]}</div></div>`;

  // 1. where you were (same structure for everyone)
  h+= s===g.murderer
    ? `<div class="fact"><b>📍 Hol voltál?</b> Valójában a tetthelyen (${esc(sc.crime)}). A fedősztorid: ${esc(sc.locs[g.alibi].at)} voltál. Oda rajtad kívül senki nem ment.</div>`
    : `<div class="fact"><b>📍 Hol voltál?</b> A gyilkosság idején ${esc(sc.locs[g.loc[s]].at)} voltál. Rajtad kívül senki nem járt ott.</div>`;
  // 2. motive, 3. embarrassing secret (everyone has both)
  h+=`<div class="fact"><b>🔥 Indítékod:</b> ${esc(c.motive)}</div>`;
  h+=`<div class="fact"><b>🤫 Kínos titkod:</b> ${esc(secretOf(g,s))}</div>`;
  // 4. secret info, role specific
  let info;
  if(role==="murd") info=`Tudod, hogy ez a nyom maradt utánad: ${esc(clueText(g,g.clueOrder[0]))} <span class="muted">Félidőben ez mindenki előtt kiderül. Két másik nyomot a Nyomozók találtak, azokról nem tudsz.</span>`;
  else if(role==="wit") info=esc(sc.witnessLine).replace("{X}","<b>"+esc(who(g,names,g.murderer))+"</b>");
  else info=`Nyomot találtál: ${esc(clueText(g, g.dets[0]===s ? g.clueOrder[1] : g.clueOrder[2]))}`;
  h+=`<div class="fact ${col}"><b>🔍 Titkos információd:</b> ${info}</div>`;
  // 5. sighting
  const t=g.sight[s];
  h+=`<div class="fact"><b>👁️ Amit láttál:</b> ${esc(who(g,names,t))} nem sokkal a gyilkosság előtt ${esc(sc.locs[g.loc[t]].toward)} ment.</div>`;
  // 6. goal
  const goal={murd:"Ne nevezzenek meg. Ha mégis, egy esélyed marad: ha kitalálod, ki a Szemtanú, akkor is te nyersz.",
    wit:"Vezesd rá a többieket a gyilkosra, de óvatosan. Ha elkapják, a gyilkos tippelhet, ki a Szemtanú. Ha téged nevez meg, a gyilkos nyer.",
    det:"A többiekkel közösen nevezzétek meg a gyilkost. Egy vádatok van."}[role];
  h+=`<p class="small"><b>🎯 Célod:</b> ${goal}</p>`;
  h+=`<p class="small muted">A titkodat nem kötelező bevallani, és bárki hazudhat. Ha a titkod a végéig nem derül ki, jár egy becsületpont.</p>`;
  h+=publicHTML(g,names);
  return h;
}

// everyone gets one new suspicious fact about someone else; everyone is targeted exactly once
function halfPlan(g){
  const r = rngFrom((g.seedBase ^ 0x9E3779B9)>>>0);
  let perm;
  do { perm = shuffle([0,1,2,3], r); } while(perm.some((t,s)=>t===s));
  const kind = [0,1,2,3].map(()=> r()<0.5 ? "motive" : "trace");
  return {perm, kind};
}
function halfHTML(g,names,s){
  const hp=halfPlan(g), t=hp.perm[s], sc=g.sc;
  let txt;
  if(hp.kind[s]==="motive")
    txt=`Egy félbehagyott levelet találtál az áldozat holmija között. <b>${esc(who(g,names,t))}</b> neve szerepel benne: „${esc(MOTIVE3[sc.id][t])}”`;
  else {
    const li = t===g.murderer ? g.alibi : g.loc[t];
    txt=`<b>${esc(who(g,names,t))}</b>: észrevetted, hogy ${esc(TRACE[sc.id][li])}.`;
  }
  return `<div class="fact gold"><b>🕛 Félidős titkos információd:</b> ${txt}</div>`;
}

/* ===================== Card link encoding ===================== */
const KEY="ejfeli-tanu-1462";
function b64u(bytes){let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const s=atob(str);return Uint8Array.from(s,c=>c.charCodeAt(0))}
function encodeCard(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  const out=new Uint8Array(raw.length+1);let sum=0;
  raw.forEach((b,i)=>{out[i]=b^KEY.charCodeAt(i%KEY.length);sum=(sum+b*(i+7))&255});
  out[raw.length]=sum;return b64u(out);
}
function decodeCard(str){
  const d=unb64u(str);const raw=new Uint8Array(d.length-1);let sum=0;
  for(let i=0;i<raw.length;i++){raw[i]=d[i]^KEY.charCodeAt(i%KEY.length);sum=(sum+raw[i]*(i+7))&255}
  if(sum!==d[d.length-1]) throw new Error("bad");
  return JSON.parse(new TextDecoder().decode(raw));
}

/* ---- play: timer ---- */
function timeLeft(){return Math.max(0,G.start+G.minutes*60000-Date.now())}
function startClock(onTick){
  clearInterval(tick);
  const f=()=>{
    const left=timeLeft();
    if(!G.half && left<=G.minutes*30000){G.half=true;G.halfDeal=0;G.halfStep="intro";save();beep();route();return}
    if(left<=0){clearInterval(tick);beep();document.querySelectorAll(".modal").forEach(x=>x.remove());G.phase="timeout";save();route();return}
    onTick&&onTick(left);
  };
  tick=setInterval(f,500);f();
}

  } else if(G.halfStep==="pass"){
    const s=G.halfDeal;
    show(`<div class="panel center" style="margin-top:40px"><div style="font-size:3rem">${g.sc.chars[s].icon}</div>
      <p class="muted">Félidő · ${s+1} / 4</p><h2>Add a telefont neki:</h2><h1>${esc(who(g,G.names,s))}</h1>
      <button class="btn" id="see">Én vagyok, megnézem</button></div>`);
    on("see",()=>{G.halfStep="see";save();route()});
  } else {
    const s=G.halfDeal;
    show(`<div class="center" style="margin-top:20px"><div style="font-size:3rem">${g.sc.chars[s].icon}</div><h2>${esc(who(g,G.names,s))}</h2></div>
      ${halfHTML(g,G.names,s)}
      <p class="small muted">Te döntöd el, elárulod-e, és mikor.</p>
      <button class="btn" id="done">Megjegyeztem, elrejtem</button>`);
    on("done",()=>{if(G.halfDeal<3){G.halfDeal++;G.halfStep="pass"}else{G.halfDeal=4}save();route()});
  }
  startClock(left=>{const t=document.getElementById("t2");if(t)t.textContent=fmt(left)});
}

/* ---- play: timer ---- */
function play(){
  if(G.half && G.halfDeal<4){halfTime();return}
  const g=game();
  show(`<p class="center muted small">${g.sc.icon} ${esc(g.sc.title)}</p>
    <div class="timer" id="t">--:--</div><div class="bar"><i id="b"></i></div>
    ${G.half?`<div class="fact gold"><b>Félidős közös nyom:</b> ${esc(clueText(g,g.clueOrder[0]))}</div>`:""}
    <button class="btn red" id="acc">⚖️ Vádemelés</button>
    <div class="row"><button class="btn ghost small" id="peek">Lapom újra</button><button class="btn ghost small" id="rules">Szabályok</button></div>
    ${publicHTML(g,G.names)}
    <p class="small muted center">Kérdezzétek egymást: hol voltál? miért? mit láttál? mi van a zsebedben?</p>
    <button class="btn ghost small" id="quit">Játék feladása</button>`);
  on("acc",()=>{G.phase="accuse";save();route()});
  on("rules",()=>{const m=modal(RULES+`<button class="btn" id="x">Bezár</button>`);m.querySelector("#x").onclick=()=>m.remove()});
  on("peek",()=>{
    const m=modal(`<h3>Kié a lap?</h3><p class="small muted">Csak a sajátodat nézd meg!</p>${g.sc.chars.map((c,i)=>`<div class="pick" data-p="${i}"><span class="ic">${c.icon}</span>${esc(who(g,G.names,i))}</div>`).join("")}<button class="btn ghost" id="x">Mégsem</button>`);
    m.querySelector("#x").onclick=()=>m.remove();
    m.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>{const p=+el.dataset.p;m.querySelector(".panel").innerHTML=(G.half?halfHTML(g,G.names,p):"")+cardHTML(g,G.names,p)+`<button class="btn" id="x2">Elrejtem</button>`;m.querySelector("#x2").onclick=()=>m.remove()});
  });
  on("quit",()=>{if(confirm("Biztosan feladjátok? A gyilkos nyer.")){G.phase="end";G.result="giveup";save();route()}});
  const total=G.minutes*60000;
  startClock(left=>{
    const t=document.getElementById("t"); if(!t)return;
    t.textContent=fmt(left);
    document.getElementById("b").style.width=(100*left/total)+"%";
    if(left<=60000)t.classList.add("pulse");
  });
}

function timeout(){
  show(`<div class="panel center" style="margin-top:30px"><div style="font-size:3rem">⌛</div><h2>Lejárt az idő!</h2>
    <p>Utolsó lehetőség: ha most azonnal megegyeztek, még vádat emelhettek. Ha nem, a gyilkos elszökik.</p>
    <button class="btn red" id="acc">⚖️ Utolsó vádemelés</button><button class="btn ghost" id="lose">Nem tudunk dönteni</button></div>`);
  on("acc",()=>{G.phase="accuse";G.late=true;save();route()});
  on("lose",()=>{G.phase="end";G.result="time";save();route()});
}

/* ---- accusation ---- */
function accuse(){
  const g=game();
  show(`<h2 class="center" style="margin-top:20px">⚖️ Vádemelés</h2><p class="center muted">Kit vádoltok? Legalább hárman kell, hogy egyetértsetek.</p>
    ${g.sc.chars.map((c,i)=>`<div class="pick" data-p="${i}"><span class="ic">${c.icon}</span>${esc(who(g,G.names,i))}</div>`).join("")}
    <button class="btn ghost" id="back">Mégsem, tovább nyomozunk</button>`);
  app.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>{
    const p=+el.dataset.p;
    const m=modal(`<div class="center"><div style="font-size:2.6rem">${g.sc.chars[p].icon}</div><h2>${esc(who(g,G.names,p))}</h2>
      <p>Legalább hárman egyetértetek? Ezt nem lehet visszavonni.</p></div>
      <button class="btn red" id="y">Igen, őt vádoljuk</button><button class="btn ghost" id="n">Mégsem</button>`);
    m.querySelector("#n").onclick=()=>m.remove();
    m.querySelector("#y").onclick=()=>{m.remove();G.accused=p;G.phase="verdict";save();route()};
  });
  on("back",()=>{G.phase=G.late?"timeout":"play";save();route()});
}

function verdict(){
  const g=game(), p=G.accused;
  show(`<div class="panel center" style="margin-top:50px"><div style="font-size:3rem">${g.sc.chars[p].icon}</div>
    <h2>${esc(who(g,G.names,p))}</h2><p class="pulse">felfedi a lapját...</p></div>`);
  setTimeout(()=>{
    if(p!==g.murderer){G.phase="end";G.result="wrong";save();route();return}
    show(`<div class="role murd" style="margin-top:30px"><div class="big">Elkaptátok!</div>
      <p>${esc(who(g,G.names,p))} a gyilkos.</p></div>
      <div class="panel"><h3>De még nincs vége.</h3>
      <p>Gyilkos, egy esélyed maradt: <b>ki volt a Szemtanú?</b> Ha eltalálod, mégis te nyersz.</p>
      <p class="small muted">Gondolkodj hangosan, ha akarsz. A döntés csak a tiéd.</p></div>
      ${g.sc.chars.map((c,i)=>i===p?"":`<div class="pick" data-p="${i}"><span class="ic">${c.icon}</span>${esc(who(g,G.names,i))}</div>`).join("")}`);
    beep();
    app.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>{
      const q=+el.dataset.p;
      const m=modal(`<div class="center"><h2>${esc(who(g,G.names,q))}</h2><p>Ő a Szemtanú? Végső döntés.</p></div>
        <button class="btn red" id="y">Igen</button><button class="btn ghost" id="n">Mégsem</button>`);
      m.querySelector("#n").onclick=()=>m.remove();
      m.querySelector("#y").onclick=()=>{m.remove();G.guess=q;G.phase="end";G.result=(q===g.witness)?"witness":"caught";save();route()};
    });
  },2600);
}

/* ---- end ---- */
function end(){
  const g=game(), sc=g.sc, hp=halfPlan(g);
  const M=esc(who(g,G.names,g.murderer)), W=esc(who(g,G.names,g.witness));
  const R={
    caught:{c:"det",t:"Az ártatlanok nyertek!",d:`Elkaptátok a gyilkost, és a Szemtanú rejtve maradt. Ő volt az: ${W}.`},
    witness:{c:"murd",t:"A gyilkos nyert!",d:`Lelepleztétek ${M} személyét, de kitalálta, hogy ${W} volt a Szemtanú. Elhallgattatta, és a vádat elejtették.`},
    wrong:{c:"murd",t:"A gyilkos nyert!",d:`Ártatlant vádoltatok. A gyilkos ${M} volt.`},
    time:{c:"murd",t:"A gyilkos nyert!",d:`Lejárt az idő, a gyilkos megszökött. ${M} volt az.`},
    giveup:{c:"murd",t:"A gyilkos nyert!",d:`Feladtátok. A gyilkos ${M} volt.`}
  }[G.result]||{c:"murd",t:"Vége",d:""};
  const roleName=s=>s===g.murderer?"🔪 Gyilkos":s===g.witness?"👁️ Szemtanú":"🔎 Nyomozó";
  const match=(s,k)=>g.vals[s][k]===g.mv[k];
  show(`<div class="role ${R.c}" style="margin-top:24px"><div class="big">${R.t}</div><p>${R.d}</p></div>
    <div class="panel"><h3>A teljes igazság</h3><table>
    ${sc.chars.map((c,s)=>`<tr><td>${c.icon}</td><td><b>${esc(who(g,G.names,s))}</b><br>${roleName(s)}<br>
      <span class="small muted">📍 ${s===g.murderer?esc(sc.crime)+" (fedősztori: "+esc(sc.locs[g.alibi].name)+")":esc(sc.locs[g.loc[s]].name)}</span><br>
      <span class="small">Titok: ${esc(secretOf(g,s))}</span><br>
      <span class="small muted">Nyomok, amikre illett: ${g.clueOrder.filter(k=>match(s,k)).map(k=>esc(sc.cats[k].vals[g.mv[k]].v)).join(", ")||"egyik sem"}</span></td></tr>`).join("")}
    </table>
    <h3 style="margin-top:14px">A nyomok</h3>${g.clueOrder.map((k,i)=>`<div class="small">• ${esc(clueText(g,k))} <span class="muted">(${i===0?"félidős közös nyom":"nála volt: "+esc(who(g,G.names,g.dets[i-1]))})</span></div>`).join("")}
    <h3 style="margin-top:14px">Félidős gyanúk</h3>${[0,1,2,3].map(s=>`<div class="small">• ${esc(who(g,G.names,s))} → ${esc(who(g,G.names,hp.perm[s]))} (${hp.kind[s]==="motive"?"indíték":"árulkodó jel"})</div>`).join("")}
    </div>
    <button class="btn" id="again">Új kör, ugyanezekkel</button><button class="btn ghost" id="home">Főmenü</button>`);
  on("again",()=>{G={seed:newSeed(),sc:G.sc,names:G.names,minutes:G.minutes,phase:"intro",deal:0,step:"pass"};save();route()});
  on("home",()=>{clearSave();home()});
}

function route(){
  clearInterval(tick);
  ({intro,deal,ready,play,timeout,accuse,verdict,end})[G.phase]();
}

window.addEventListener("hashchange",()=>location.reload());
const h=location.hash.match(/#k=([\w-]+)/);
if(h) cardView(h[1]);
else { const s=load(); if(s&&s.phase&&s.phase!=="intro"&&s.phase!=="end"){home()} else home(); }
}
</script>
</body>
</html>
