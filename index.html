.muted{color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}

.btn:active{transform:scale(.98)}

.btn.red{background:var(--red);color:#fff}
.btn.small{padding:10px;font-size:.95rem}
.row{display:flex;gap:10px}.row>*{flex:1}
.scen{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;

.story p{font-family:Georgia,serif;font-size:1.05rem}
.role{border-radius:14px;padding:16px;margin:12px 0;text-align:center}

.role.det{background:linear-gradient(135deg,#1f3a2a,#14231a);border:1px solid var(--green)}

/* ===================== Game generation (pure, deterministic) ===================== */
function rngFrom(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickOne(arr,r){return arr[Math.floor(r()*arr.length)]}

function generate(seed, scId){
  const sc = SCENARIOS.find(s=>s.id===scId) || SCENARIOS[0];
  const r = rngFrom(seed);
  const seats=[0,1,2,3];
  const murderer = Math.floor(r()*4);
  const others = shuffle(seats.filter(s=>s!==murderer), r);
  const witness = others[0];
  const dets = [others[1], others[2]];
  const innocents = seats.filter(s=>s!==murderer);

  // traits[seat][cat] = true means the "A" (clue) value
  let traits;
  for(let tries=0;tries<500;tries++){
    traits = seats.map(s => s===murderer ? [true,true,true] : [0,1,2].map(()=>r()<0.45));
    const noFull = innocents.every(s=>!(traits[s][0]&&traits[s][1]&&traits[s][2]));
    const everyCatHerring = [0,1,2].every(c=>innocents.some(s=>traits[s][c]));
    const noBlank = innocents.filter(s=>!traits[s].some(Boolean)).length<=1;
    if(noFull && everyCatHerring && noBlank) break;
  }
  // clue order: k0 public at half time (murderer knows it), k1 -> dets[0], k2 -> dets[1]
  const clueOrder = shuffle([0,1,2], r);

  // locations: innocents get distinct secret locations, murderer was at crime scene
  const locOrder = shuffle([0,1,2,3,4], r);
  const loc = {}; innocents.forEach((s,i)=>loc[s]=locOrder[i]);
  loc[murderer] = -1;
  const alibi = locOrder[3];

  // sightings
  const sight = {};
  const catcherIdx = Math.floor(r()*2);
  const catcher = dets[catcherIdx], other = dets[1-catcherIdx];
  const catchCat = clueOrder[1 + (1-catcherIdx)];          // the clue the OTHER detective holds
  sight[catcher] = {type:"trait", who:murderer, cat:catchCat};
  const otherTargets = innocents.filter(s=>s!==other);
  const ot = pickOne(otherTargets, r);
  sight[other] = r()<0.5 ? {type:"loc", who:ot} : {type:"trait", who:ot, cat:Math.floor(r()*3)};
  const wt = pickOne(dets, r);
  sight[witness] = r()<0.5 ? {type:"loc", who:wt} : {type:"trait", who:wt, cat:Math.floor(r()*3)};
  sight[murderer] = {type:"loc", who:pickOne(innocents, r)};

  return {sc, murderer, witness, dets, traits, clueOrder, loc, alibi, sight};
}

/* ===================== Card text ===================== */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function who(g,names,s){const c=g.sc.chars[s];const n=(names&&names[s]||"").trim();return n?`${n} (${c.name})`:c.name}
function roleOf(g,s){return s===g.murderer?"murd":s===g.witness?"wit":"det"}
function sightText(g,names,s){
  const x=g.sight[s]; const w=esc(who(g,names,x.who));
  if(x.type==="loc"){
    const L=g.sc.locs[g.loc[x.who]];
    return `<b>${w}</b>: nem sokkal a gyilkosság előtt ${L.toward} ment. Láttad.`;
  }
  const cat=g.sc.cats[x.cat];
  return `<b>${w}</b>: ${g.traits[x.who][x.cat]?cat.seeA:cat.seeB}`;
}
function cardHTML(g,names,s){
  const sc=g.sc, c=sc.chars[s], role=roleOf(g,s);
  let h=`<div class="center"><div style="font-size:3rem">${c.icon}</div><h2>${esc(who(g,names,s))}</h2>
    <p class="muted small">${esc(c.bio)}</p></div>`;
  if(role==="murd"){
    h+=`<div class="role murd"><div class="small">A szereped</div><div class="big">Gyilkos</div>
      <div class="small">Te ölted meg. Senki nem tudja. Még.</div></div>
      <div class="fact red"><b>Indítékod:</b> ${esc(c.motive)}</div>
      <div class="fact red"><b>Egy nyomról tudsz:</b> ${esc(sc.cats[g.clueOrder[0]].clue)} <span class="muted">Félidőben ez mindenki előtt kiderül.</span></div>
      <div class="fact red">A többi nyomról nem tudsz. Lehet, hogy más is maradt utánad.</div>
      <div class="fact red"><b>Hamis alibi ötlet:</b> mondd, hogy ${esc(sc.locs[g.alibi].at)} voltál.</div>
      <p class="small"><b>Célod:</b> ne nevezzenek meg. Ha mégis, egy esélyed marad: ha kitalálod, ki a Szemtanú, akkor is te nyersz. Figyeld, ki tud túl sokat.</p>`;
  } else if(role==="wit"){
    h+=`<div class="role wit"><div class="small">A szereped</div><div class="big">Szemtanú</div>
      <div class="small">Ártatlan vagy, és tudod a választ.</div></div>
      <div class="fact blue">${esc(sc.witnessLine).replace("{X}","<b>"+esc(who(g,names,g.murderer))+"</b>")}</div>
      <p class="small"><b>Célod:</b> vezesd rá a többieket a gyilkosra, de óvatosan. Ha elkapják, a gyilkos még tippelhet, ki a Szemtanú. Ha téged nevez meg, a gyilkos nyer.</p>`;
  } else {
    const k = g.dets[0]===s ? g.clueOrder[1] : g.clueOrder[2];
    h+=`<div class="role det"><div class="small">A szereped</div><div class="big">Nyomozó</div>
      <div class="small">Ártatlan vagy. Találd meg a gyilkost.</div></div>
      <div class="fact green"><b>Nyom, amit te találtál:</b> ${esc(sc.cats[k].clue)}</div>
      <p class="small"><b>Célod:</b> a többiekkel közösen nevezzétek meg a gyilkost. Egy vádatok van.</p>`;
  }
  // own truth
  h+=`<h3 style="margin-top:16px">Amit magadról tudsz</h3><div class="panel" style="margin-top:6px">`;
  h+= s===g.murderer
    ? `<div>📍 A gyilkosság idején a tetthelyen voltál: <b>${esc(sc.crime)}</b>. Ezt titkold!</div>`
    : `<div>📍 A gyilkosság idején ${esc(sc.locs[g.loc[s]].at)} voltál.</div>`;
  sc.cats.forEach((cat,i)=>{h+=`<div>• ${esc(cat.label)}: <b>${esc(g.traits[s][i]?cat.A:cat.B)}</b></div>`});
  h+=`</div>`;
  if(s!==g.murderer){
    h+=`<div class="fact"><b>Kínos titkod:</b> ${esc(sc.locs[g.loc[s]].secret)} <span class="muted">Nem bűn, csak szégyen. Ha a végéig nem derül ki, jár egy titkos becsületpont.</span></div>`;
  }
  h+=`<div class="fact"><b>Amit láttál:</b> ${sightText(g,names,s)}</div>`;
  h+=`<p class="small muted">Bárki hazudhat. Az igazság csak ezen a lapon van.</p>`;
  return h;
}

/* ===================== Card link encoding ===================== */
const KEY="ejfeli-tanu-1462";
function b64u(bytes){let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const s=atob(str);return Uint8Array.from(s,c=>c.charCodeAt(0))}
function encodeCard(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  const out=new Uint8Array(raw.length+1);let sum=0;
  raw.forEach((b,i)=>{out[i]=b^KEY.charCodeAt(i%KEY.length);sum=(sum+b*(i+7))&255});
  out[raw.length]=sum;return b64u(out);
}
function decodeCard(str){
  const d=unb64u(str);const raw=new Uint8Array(d.length-1);let sum=0;
  for(let i=0;i<raw.length;i++){raw[i]=d[i]^KEY.charCodeAt(i%KEY.length);sum=(sum+raw[i]*(i+7))&255}
  if(sum!==d[d.length-1]) throw new Error("bad");
  return JSON.parse(new TextDecoder().decode(raw));
}

function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(t=>{
  const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=660;o.connect(g);g.connect(ctx.destination);
  g.gain.setValueAtTime(0.25,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.22);
  o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.24)})}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
async function keepAwake(){try{if("wakeLock" in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}}catch(e){}}
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="panel fade">${html}</div>`;document.body.appendChild(m);return m}

/* ---- deal cards one by one ---- */
function deal(){
  const g=game(), s=G.deal;
  if(G.step==="pass"){
    show(`<div class="panel center" style="margin-top:40px"><div style="font-size:3rem">${g.sc.chars[s].icon}</div>
      <p class="muted">${s+1} / 4</p><h2>Add a telefont neki:</h2><h1>${esc(who(g,G.names,s))}</h1>
      <p class="small muted">A többiek ne nézzenek oda.</p>
      <button class="btn" id="see">Én vagyok, megnézem a lapom</button></div>`);
    on("see",()=>{G.step="card";save();route()});
  } else {
    const url=location.origin+location.pathname+"#k="+encodeCard({s:G.seed,c:G.sc,p:s,n:G.names});
    show(`${cardHTML(g,G.names,s)}
      <div class="panel center"><p class="small"><b>Vidd magaddal a lapod:</b> szkenneld be a saját telefonoddal, így játék közben bármikor megnézheted.</p>
      <div class="qr" id="qr"></div></div>
      <button class="btn" id="done">Megjegyeztem, elrejtem</button>`);
    try{new QRCode(document.getElementById("qr"),{text:url,width:190,height:190,correctLevel:QRCode.CorrectLevel.L})}
    catch(e){document.getElementById("qr").outerHTML=`<p class="small muted">A QR-kód nem töltött be.</p>`}
    on("done",()=>{
      if(G.deal<3){G.deal++;G.step="pass";save();route()}
      else{G.phase="ready";save();route()}
    });
  }
}

function ready(){
  show(`<div class="panel center" style="margin-top:40px"><div style="font-size:3rem">🕯️</div><h2>Mindenki tudja, ki kicsoda.</h2>
    <p>Tegyétek le a telefont középre. Az óra indul, amint megnyomjátok.</p>

  on("go",()=>{G.phase="play";G.start=Date.now();G.half=false;save();keepAwake();route()});
}

/* ---- play: timer ---- */
function play(){
  const g=game();
  show(`<p class="center muted small">${g.sc.icon} ${esc(g.sc.title)}</p>
    <div class="timer" id="t">--:--</div><div class="bar"><i id="b"></i></div>
    <div class="panel"><b>A tetthely:</b> ${esc(g.sc.crime)}<br><span class="small muted">Kérdezzétek egymást: hol voltál? mit láttál? mutasd a kezed!</span></div>
    <div id="pub"></div>
    <button class="btn red" id="acc">⚖️ Vádemelés</button>
    <div class="row"><button class="btn ghost small" id="peek">Lapom újra</button><button class="btn ghost small" id="rules">Szabályok</button></div>
    <button class="btn ghost small" id="quit">Játék feladása</button>`);
  const pub=document.getElementById("pub");
  function drawPub(){if(G.half)pub.innerHTML=`<div class="fact"><b>Félidős nyom (mindenki tudja):</b> ${esc(g.sc.cats[g.clueOrder[0]].clue)}</div>`}
  drawPub();
  on("acc",()=>{G.phase="accuse";save();route()});
  on("rules",()=>{const m=modal(RULES+`<button class="btn" id="x">Bezár</button>`);m.querySelector("#x").onclick=()=>m.remove()});
  on("peek",()=>{
    const m=modal(`<h3>Kié a lap?</h3><p class="small muted">Csak a sajátodat nézd meg!</p>${g.sc.chars.map((c,i)=>`<div class="pick" data-p="${i}"><span class="ic">${c.icon}</span>${esc(who(g,G.names,i))}</div>`).join("")}<button class="btn ghost" id="x">Mégsem</button>`);
    m.querySelector("#x").onclick=()=>m.remove();
    m.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>{m.querySelector(".panel").innerHTML=cardHTML(g,G.names,+el.dataset.p)+`<button class="btn" id="x2">Elrejtem</button>`;m.querySelector("#x2").onclick=()=>m.remove()});
  });
  on("quit",()=>{if(confirm("Biztosan feladjátok? A gyilkos nyer.")){G.phase="end";G.result="giveup";save();route()}});
  const total=G.minutes*60000;
  function upd(){
    const left=Math.max(0,G.start+total-Date.now());
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    const t=document.getElementById("t"); if(!t){clearInterval(tick);return}
    t.textContent=`${m}:${String(s).padStart(2,"0")}`;
    document.getElementById("b").style.width=(100*left/total)+"%";
    if(left<=60000)t.classList.add("pulse");
    if(!G.half && left<=total/2){G.half=true;save();drawPub();beep();
      const mm=modal(`<div class="center"><div style="font-size:2.4rem">🔎</div><h2>Félidő: új nyom!</h2></div><div class="fact">${esc(g.sc.cats[g.clueOrder[0]].clue)}</div><button class="btn" id="x">Értem</button>`);
      mm.querySelector("#x").onclick=()=>mm.remove();}
    if(left<=0){clearInterval(tick);beep();document.querySelectorAll(".modal").forEach(x=>x.remove());G.phase="timeout";save();route()}
  }
  clearInterval(tick);tick=setInterval(upd,500);upd();
}

function timeout(){
  show(`<div class="panel center" style="margin-top:30px"><div style="font-size:3rem">⌛</div><h2>Lejárt az idő!</h2>
    <p>Utolsó lehetőség: ha most azonnal megegyeztek, még vádat emelhettek. Ha nem, a gyilkos elszökik.</p>
    <button class="btn red" id="acc">⚖️ Utolsó vádemelés</button><button class="btn ghost" id="lose">Nem tudunk dönteni</button></div>`);
  on("acc",()=>{G.phase="accuse";G.late=true;save();route()});
  on("lose",()=>{G.phase="end";G.result="time";save();route()});
}

  on("again",()=>{G={seed:newSeed(),sc:G.sc,names:G.names,minutes:G.minutes,phase:"intro",deal:0,step:"pass"};save();route()});
  on("home",()=>{clearSave();home()});
}

function route(){
  clearInterval(tick);
  ({intro,deal,ready,play,timeout,accuse,verdict,end})[G.phase]();
}

window.addEventListener("hashchange",()=>location.reload());
const h=location.hash.match(/#k=([\w-]+)/);
if(h) cardView(h[1]);
else { const s=load(); if(s&&s.phase&&s.phase!=="intro"&&s.phase!=="end"){home()} else home(); }
}
</script>
</body>
</html>
