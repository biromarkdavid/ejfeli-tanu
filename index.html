<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Éjféli Tanú</title>
<meta name="description" content="Titkos szerepes gyilkosos nyomozós partijáték 4-6 főre, mindenki a saját telefonján.">
<meta name="theme-color" content="#121016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="data.js"></script>
<style>
:root{
  --bg:#121016; --panel:#1c1922; --panel2:#25212d; --line:#3a3444;
  --text:#ece6dc; --muted:#a59cad; --gold:#d9b46a; --gold2:#f0d79c;
  --red:#d2554d; --green:#6fbf8a; --blue:#7aa7d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  background:radial-gradient(ellipse at top,#2a2030 0%,var(--bg) 60%) fixed;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0 0 .4em;line-height:1.2}
h1{font-size:2.2rem;color:var(--gold2)} h2{font-size:1.45rem;color:var(--gold2)} h3{font-size:1.05rem;color:var(--gold)}
p{margin:.4em 0 .9em}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:14px 16px;margin:10px 0;border:0;border-radius:12px;font:600 1.02rem Inter,sans-serif;
  background:var(--gold);color:#1a1410;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:1rem Inter,sans-serif}
label{display:block;margin:8px 0 4px;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:.92rem}
.chip.on{background:var(--gold);color:#1a1410;border-color:var(--gold)}
.story{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:var(--panel2)}
.story.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:#2f3a2f;color:var(--green)}
.badge.red{background:#3a2424;color:#f19a92} .badge.blue{background:#22303f;color:var(--blue)} .badge.gold{background:#3a3020;color:var(--gold2)}
.qrbox{background:#fff;padding:14px;border-radius:14px;display:inline-block;margin:10px auto}
/* reading */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.steps{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}
.steps b{color:var(--gold2)}
.pfp{width:96px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:2px solid var(--gold);background:#2a2430}
.kv{margin:10px 0}
.kv b{display:block;color:var(--gold);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.role{font:800 1.6rem "Playfair Display",serif;letter-spacing:.04em}
.role.G,.role.B{color:#f19a92} .role.S{color:var(--blue)} .role.N{color:var(--green)}
/* scene */
#scene{position:fixed;inset:0;overflow:hidden;background:#0d0b10}
#scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.62) saturate(.9)}
#scene .bg.none{background:radial-gradient(ellipse at 50% 55%,#3a2a36 0%,#16121a 70%)}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) 12px 0;z-index:3}
.hbtn{width:52px;height:52px;border-radius:14px;border:1px solid #ffffff30;background:#00000070;color:#fff;font-size:1.5rem;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.hright{display:flex;flex-direction:column;gap:8px}
#clock{width:min(34vw,150px);height:min(34vw,150px);filter:drop-shadow(0 4px 16px #0009)}
#clock.urgent{animation:pulse 1s infinite}
#clock.paused{opacity:.75}
@keyframes pulse{50%{transform:scale(1.05)}}
.stage{position:absolute;left:0;right:0;top:calc(min(34vw,150px) + 30px);bottom:calc(10px + env(safe-area-inset-bottom));z-index:2}
.victim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#e6c7c2;font-size:.8rem;pointer-events:none}
.victim .vb{font-size:2.2rem;opacity:.7}
.ch{position:absolute;width:min(22vw,104px);transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.ch img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:2px solid #ffffff55;box-shadow:0 6px 18px #000a;background:#2a2430}
.ch span{display:block;font-size:.74rem;line-height:1.2;margin-top:4px;text-shadow:0 1px 4px #000;color:#fff}
.ch.me img{border-color:var(--gold)}
.subs{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;background:#000000b8;border:1px solid #ffffff22;border-radius:14px;padding:14px;max-height:46vh;overflow:auto}
.modal{position:fixed;inset:0;z-index:20;background:#000000d8;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--muted);font-size:1.6rem;cursor:pointer}
.zoomimg{width:100%;border-radius:12px;cursor:zoom-in;display:block}
.zoomwrap{overflow:auto;border-radius:12px;max-height:60vh;touch-action:pan-x pan-y pinch-zoom}
.zoomwrap.z .zoomimg{width:260%;max-width:none;cursor:zoom-out}
.tipbox{border:2px solid var(--gold);text-align:left}
.tipbox h2{color:var(--gold2)}
textarea{width:100%;min-height:42vh;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fbf6ea;color:#2b2233;font:1rem/1.5 Georgia,serif}
.sus{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sus button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:6px 10px;font-size:.82rem}
.sus button.s1{background:#4a2a26;border-color:var(--red)} .sus button.s2{background:#24382a;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid .c{text-align:center;font-size:.8rem}
.grid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.grid .c.on img{border-color:var(--gold)}
.evil{filter:sepia(.4) saturate(1.6) hue-rotate(-25deg) contrast(1.15) brightness(.8)}
.flip{animation:flip 1.2s ease}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.big{font:800 2rem "Playfair Display",serif;text-align:center;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===================== constants ===================== */
const READ = [30, 60, 30];          // seconds for the three card steps (total 2:00): role, info, mini mission
const OVERTURE = 45;                // narration window before the clock starts
const TIP = 30;                     // seconds a private tip stays on screen, clock paused
const TIPS_AT = {15: [450], 30: [1200, 600], 60: [2700, 1800, 900]};  // remaining seconds
const ROUND = "ABC";
const STORE = "et3-";

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const app = document.getElementById("app");
function ls(k, v) {
  try { if (v === undefined) return JSON.parse(localStorage.getItem(STORE + k) || "null"); localStorage.setItem(STORE + k, JSON.stringify(v)); } catch (e) { return null; }
}
function placeholder(name, evil) {
  const ini = name.split(/\s+/).filter(w => /^[A-ZÁÉÍÓÖŐÚÜŰ]/.test(w)).map(w => w[0]).join("").slice(0, 2) || name[0];
  const bg = evil ? "#4a1f22" : "#2c2534";
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'><rect width='200' height='300' fill='${bg}'/>` +
    `<circle cx='100' cy='105' r='42' fill='#00000055'/><path d='M30 300 C30 200 170 200 170 300Z' fill='#00000055'/>` +
    `<text x='100' y='122' font-family='Georgia' font-size='46' fill='#d9b46a' text-anchor='middle'>${ini}</text>` +
    `<text x='100' y='282' font-family='Arial' font-size='15' fill='#a59cad' text-anchor='middle'>KÉP HELYE</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg).replace(/'/g, "%27");
}
function pimg(story, slot, opts = {}) {
  const c = story.chars[slot];
  const src = `assets/${story.id}/K${slot + 1}${opts.evil ? "_evil" : ""}.jpg`;
  const fallback = opts.evil ? `assets/${story.id}/K${slot + 1}.jpg` : placeholder(c.name, false);
  return `<img src="${src}" alt="${esc(c.name)}" class="${opts.cls || ""}${opts.evil ? " evilf" : ""}" ` +
    `onerror="if(this.dataset.f){this.onerror=null;this.src='${placeholder(c.name, !!opts.evil)}'}else{this.dataset.f=1;this.src='${fallback}';${opts.evil ? "this.classList.add('evil');" : ""}}">`;
}

/* ===================== card link encoding ===================== */
const KEY = "ejfeli-tanu-1462";
function b64u(bytes) { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64u(str) { str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "="; const s = atob(str); return Uint8Array.from(s, c => c.charCodeAt(0)); }
function encodeCard(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  const out = new Uint8Array(raw.length + 1); let sum = 0;
  raw.forEach((b, i) => { out[i] = b ^ KEY.charCodeAt(i % KEY.length); sum = (sum + b * (i + 7)) & 255; });
  out[raw.length] = sum; return b64u(out);
}
function decodeCard(str) {
  const d = unb64u(str); const raw = new Uint8Array(d.length - 1); let sum = 0;
  for (let i = 0; i < raw.length; i++) { raw[i] = d[i] ^ KEY.charCodeAt(i % KEY.length); sum = (sum + raw[i] * (i + 7)) & 255; }
  if (sum !== d[d.length - 1]) throw new Error("bad");
  return JSON.parse(new TextDecoder().decode(raw));
}
function cardUrl(P) { return location.origin + location.pathname + "#c=" + encodeCard(P); }

/* ===================== audio (host phone only) ===================== */
const AU = {ctx: null, master: null, music: null, tension: null, nodes: [], muted: false, lastTick: -1, mode: ""};
function ensureAudio() {
  try {
    if (!AU.ctx) {
      AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
      AU.master = AU.ctx.createGain(); AU.master.gain.value = .9; AU.master.connect(AU.ctx.destination);
    }
    if (AU.ctx.state === "suspended") AU.ctx.resume();
    if (window.speechSynthesis && !AU.warm) { AU.warm = 1; const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
  } catch (e) {}
}
function tone(freq, dur, type = "sine", vol = .2, when = 0) {
  if (!AU.ctx || AU.muted) return;
  const t = AU.ctx.currentTime + when, o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, vol = .2, hp = 2000, when = 0) {
  if (!AU.ctx || AU.muted) return;
  const t = AU.ctx.currentTime + when, len = Math.max(1, AU.ctx.sampleRate * dur), b = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AU.ctx.createBufferSource(), f = AU.ctx.createBiquadFilter(), g = AU.ctx.createGain();
  f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(AU.master); s.start(t);
}
const tick = loud => { noise(.03, .25 + loud * .5, 3500); tone(1800, .03, "square", .04 + loud * .08); };
const chime = () => { tone(880, .9, "sine", .16); tone(1320, 1.1, "sine", .1, .12); };
const drumroll = sec => { for (let i = 0; i < sec * 18; i++) noise(.05, .12 + i / (sec * 18) * .25, 300, i / 18); tone(110, 1.2, "triangle", .35, sec); };
// Placeholder music: a story file assets/<id>/music.mp3 (and tension.mp3) wins when it exists, else a generated drone.
function startMusic(story) {
  if (AU.mode) return; AU.mode = "calm";
  const a = new Audio(`assets/${story.id}/music.mp3`); a.loop = true; a.volume = .45;
  a.play().then(() => { AU.music = a; }).catch(() => drone());
}
function drone() {
  if (!AU.ctx) return;
  const g = AU.ctx.createGain(); g.gain.value = .05; const lp = AU.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
  [55, 55.4, 82.4].forEach(f => { const o = AU.ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(lp); o.start(); AU.nodes.push(o); });
  const lfo = AU.ctx.createOscillator(), lg = AU.ctx.createGain(); lfo.frequency.value = .08; lg.gain.value = 250; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  lp.connect(g); g.connect(AU.master); AU.drone = g;
}
function tensionOn(story) {
  if (AU.mode === "tension") return; AU.mode = "tension";
  const a = new Audio(`assets/${story.id}/tension.mp3`); a.loop = true; a.volume = .5;
  a.play().then(() => { if (AU.music) AU.music.pause(); AU.tension = a; }).catch(() => {
    if (AU.drone) AU.drone.gain.value = .08;
    AU.pulse = setInterval(() => { tone(55, .35, "sine", .5); tone(110, .12, "triangle", .12); }, 750);
  });
}
function stopMusic() {
  [AU.music, AU.tension].forEach(a => a && a.pause()); clearInterval(AU.pulse);
  AU.nodes.forEach(o => { try { o.stop(); } catch (e) {} }); AU.nodes = []; if (AU.drone) AU.drone.gain.value = 0; AU.mode = "done";
}
function narrate(story) {
  const a = new Audio(`assets/${story.id}/narration.mp3`);
  a.play().catch(() => {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(story.intro); u.lang = "hu-HU"; u.rate = .95;
    const v = speechSynthesis.getVoices().find(v => /^hu/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  });
}

/* ===================== lobby (host) ===================== */
const L = ls("lobby") || {story: "S01", mode: 30, names: ["", "", "", ""], pick: [0, 1, 2, 3], gather: 90};
function lobby() {
  const S = STORIES.find(s => s.id === L.story);
  const n = L.names.length;
  let h = `<h1>Éjféli Tanú</h1><p class="muted">Titkos szerepes gyilkosos partijáték 4-6 főre. Mindenki a saját telefonján játszik, ez a telefon a játékvezetőé (ő is játszik).</p>`;
  h += `<div class="panel"><h3>1. Történet</h3>`;
  STORIES.forEach(s => h += `<div class="story ${s.id === L.story ? "on" : ""}" data-st="${s.id}"><div><b>${esc(s.title)}</b> ${s.full ? '<span class="badge gold">teszt: teljesen kész</span>' : '<span class="badge">vázlat</span>'}<div class="small muted">${esc(s.world)}</div></div></div>`);
  h += `</div><div class="panel"><h3>2. Játékidő</h3><div class="chips">` +
    [15, 30, 60].map(m => `<span class="chip ${L.mode === m ? "on" : ""}" data-mode="${m}">${m} perc</span>`).join("") +
    `</div><p class="small muted">15 perc: 1 titkos tipp · 30 perc: 2 · 60 perc: 3. Előtte a történet és 2 perc a saját lap elolvasására.</p></div>`;
  h += `<div class="panel"><h3>3. Játékosok</h3><p class="small muted">Elég a neveket megadni, a karaktereket a gép sorsolja ki. Az első a játékvezető (ezen a telefonon), ő is játszik.</p>`;
  for (let i = 0; i < n; i++) {
    h += `<div style="margin:6px 0"><input data-name="${i}" placeholder="${i === 0 ? "Te (játékvezető)" : (i + 1) + ". játékos"}" value="${esc(L.names[i])}"></div>`;
  }
  h += `<div class="row"><button class="btn ghost" id="minus" ${n <= 4 ? "disabled" : ""}>− játékos</button><button class="btn ghost" id="plus" ${n >= 6 ? "disabled" : ""}>+ játékos</button></div>`;
  h += `</div>`;
  h += `<div class="panel"><h3>4. Indulás</h3><label>Ennyi idő legyen a QR-kódok beolvasására</label><div class="chips">` +
    [60, 90, 120, 180].map(g => `<span class="chip ${L.gather === g ? "on" : ""}" data-gather="${g}">${g < 120 ? g + " mp" : g / 60 + " perc"}</span>`).join("") +
    `</div><p class="small muted">Utána minden telefonon egyszerre indul a játék.</p><div id="err" class="small" style="color:var(--red)"></div><button class="btn" id="go">Kártyák kiosztása</button></div>`;
  app.innerHTML = h;
  const save = () => ls("lobby", L);
  app.querySelectorAll("[data-st]").forEach(e => e.onclick = () => { L.story = e.dataset.st; save(); lobby(); });
  app.querySelectorAll("[data-mode]").forEach(e => e.onclick = () => { L.mode = +e.dataset.mode; save(); lobby(); });
  app.querySelectorAll("[data-gather]").forEach(e => e.onclick = () => { L.gather = +e.dataset.gather; save(); lobby(); });
  app.querySelectorAll("[data-name]").forEach(e => e.oninput = () => { L.names[+e.dataset.name] = e.value; save(); });
  $("#plus").onclick = () => { L.names.push(""); L.pick = [...Array(L.names.length).keys()]; save(); lobby(); };
  $("#minus").onclick = () => { L.names.pop(); L.pick = [...Array(L.names.length).keys()]; save(); lobby(); };
  $("#go").onclick = () => {
    const names = L.names.map((s, i) => s.trim() || (i === 0 ? "Játékvezető" : (i + 1) + ". játékos"));
    const pick = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pick[i], pick[j]] = [pick[j], pick[i]]; }
    ensureAudio();
    const x = +(new URLSearchParams(location.search).get("x") || 1);
    const base = {v: 3, s: L.story, m: L.mode, n: names, ch: pick, t0: Date.now() + L.gather * 1000 / x, x};
    ls("deal", base);
    deal(base, 1);
  };
}
function deal(base, i) {
  const n = base.n.length;
  if (i >= n) { location.hash = "c=" + encodeCard({...base, p: 0}); return; }
  const S = STORIES.find(s => s.id === base.s);
  app.innerHTML = `<div class="topbar"><div class="bar"><i id="gbar"></i></div><div class="steps"><span>Indulásig</span><b id="gleft"></b></div></div>
    <h2 class="center">${esc(base.n[i])}</h2><p class="center muted">Olvasd be a telefonoddal. Csak a saját kódodat nézd!</p>
    <div class="center"><div class="qrbox" id="qr"></div></div>
    <p class="center small muted">${i}/${n - 1}</p>
    <button class="btn" id="next">${i < n - 1 ? "Következő játékos" : "Kész: saját lapom megnyitása"}</button>
    <button class="btn ghost" id="back">Vissza</button>`;
  new QRCode($("#qr"), {text: cardUrl({...base, p: i}), width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L});
  $("#next").onclick = () => deal(base, i + 1);
  $("#back").onclick = () => i > 1 ? deal(base, i - 1) : lobby();
  const up = () => { if (!$("#gleft")) return clearInterval(t); const left = Math.max(0, (base.t0 - Date.now()) / 1000 * base.x); $("#gleft").textContent = Math.ceil(left) + " mp"; $("#gbar").style.width = (100 * left / L.gather) + "%"; };
  const t = setInterval(up, 250); up();
}

/* ===================== game (every phone) ===================== */
let P, S, ME, SLOT, NOW = () => Date.now();
const ST = {userStep: 0, key: "", tipSeen: {}};
function TL() {
  let e = (NOW() - P.t0) / 1000 * P.x;
  if (e < 0) return {ph: "wait", left: -e};
  if (e < OVERTURE) return {ph: "ovr", e, left: OVERTURE - e};
  e -= OVERTURE;
  if (e < 120) return {ph: "read", e, ts: e < READ[0] ? 0 : e < READ[0] + READ[1] ? 1 : 2, left: 120 - e};
  e -= 120;
  const D = P.m * 60, T = TIPS_AT[P.m];

    if (e < st) return {ph: "play", rem: D - (e - TIP * i)};
    if (e < st + TIP) return {ph: "tip", i, rem: T[i], left: st + TIP - e};

  if (t.ph === "ovr") { const b = $("#obar"); if (b) b.style.width = (100 * t.left / OVERTURE) + "%"; }
  if (t.ph === "read") {

    if (t.left < 10 && $("#rwarn")) $("#rwarn").textContent = "Mindjárt indul a játék!";

    }

}

function drawClock(frac, paused, urgent) {

  const a = frac * 2 * Math.PI, r = 44, x = 50 + r * Math.sin(a), y = 50 - r * Math.cos(a);

    `<path d="M50 50 L50 ${50 - r} A${r} ${r} 0 ${a > Math.PI ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="#c0392b"/>`;
  let ticks = ""; for (let i = 0; i < 60; i++) { const b = i * 6 * Math.PI / 180, l = i % 5 ? 3 : 7; ticks += `<line x1="${50 + 47 * Math.sin(b)}" y1="${50 - 47 * Math.cos(b)}" x2="${50 + (47 - l) * Math.sin(b)}" y2="${50 - (47 - l) * Math.cos(b)}" stroke="#2b2233" stroke-width="${i % 5 ? .6 : 1.4}"/>`; }
  el.innerHTML = `<circle cx="50" cy="50" r="49" fill="#efe6d2" stroke="#8a6d3b" stroke-width="2"/>${wedge}${ticks}
    <line x1="50" y1="50" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#2b2233" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4" fill="#2b2233"/>${paused ? `<rect x="42" y="64" width="5" height="14" fill="#2b2233"/><rect x="53" y="64" width="5" height="14" fill="#2b2233"/>` : ""}`;
  el.classList.toggle("urgent", !!urgent); el.classList.toggle("paused", !!paused);
}

      const j = top[0], r = roleOf(j), sl = P.ch[j], evil = r === "G" || r === "B";
      h += `<div class="center flip">${pimg(S, sl, {cls: "pfp", evil})}</div><p class="big">${esc(S.chars[sl].name)}</p><p class="center muted">${esc(P.n[j])} · ${max} szavazat</p>`;
      if (r === "G") { h += `<p class="big" style="color:var(--red)">A GYILKOS volt!</p><p class="center">Utolsó esély: ha kitalálja, ki a szemtanú, mégis a gonoszok nyernek.</p><button class="btn" id="g">${esc(P.n[j])}, tippelj a szemtanúra</button>`; V.conv = j; }
      else if (r === "B") { h += `<p class="big" style="color:var(--red)">A BŰNTÁRS volt!</p><p class="big" style="color:var(--green)">Az ártatlanok nyertek!</p>`; V.outcome = "good"; }
      else { h += `<p class="big" style="color:var(--green)">ÁRTATLAN volt.</p><p class="big" style="color:var(--red)">A gonoszok nyertek!</p>`; V.outcome = "evil"; }
    }
    h += `<div class="panel small"><b>Szavazatok:</b> ${P.n.map((nm, j) => `${esc(nm)}: ${tally[j]}`).join(" · ")}</div>`;
    if (V.outcome) h += `<button class="btn" id="fin">Megoldás és szerepek</button>`;
    app.innerHTML = h; save();
    tone(V.outcome === "good" ? 660 : 160, 1.2, "triangle", .3);
    if ($("#extra")) $("#extra").onclick = () => { ensureAudio(); V.stage = "extra"; V.extraEnd = Date.now() + 180000 / P.x; save(); voteFlow(); };
    if ($("#g")) $("#g").onclick = () => { V.stage = "guess"; save(); voteFlow(); };
    if ($("#fin")) $("#fin").onclick = () => { V.stage = "final"; save(); voteFlow(); };
  } else if (V.stage === "extra") {
    app.innerHTML = `<div class="center" style="padding-top:4vh"><h1>Még 3 perc!</h1><p>Győzzétek meg egymást: ${V.cands.map(j => `<b>${esc(S.chars[P.ch[j]].name)}</b>`).join(" vagy ")}?</p>
      <svg id="clock" viewBox="0 0 100 100" style="width:60vw;max-width:260px;height:auto"></svg><button class="btn" id="now">Kész, szavazzunk most</button></div>`;
    const go = () => { clearInterval(V._t); V.stage = "pass"; V.i = 0; V.votes = {}; V.round2 = 1; save(); voteFlow(); };
    $("#now").onclick = go;
    let last = -1;
    V._t = setInterval(() => {
      if (!$("#now")) return clearInterval(V._t);
      const rem = (V.extraEnd - Date.now()) / 1000 * P.x;
      drawClock(rem / 180, false, rem <= 30);
      if (rem <= 60) { const sec = Math.ceil(rem); if (sec !== last) { last = sec; tick(1 - rem / 60); } }
      if (rem <= 0) go();
    }, 200);
  } else if (V.stage === "guess") {
    let sel = null; const j0 = V.conv;
    app.innerHTML = `<h2>${esc(P.n[j0])}: ki a szemtanú?</h2><div class="grid">` +
      P.ch.map((sl, j) => j === j0 ? "" : `<div class="c" data-j="${j}">${pimg(S, sl)}<b>${esc(S.chars[sl].name)}</b><br><span class="muted">${esc(P.n[j])}</span></div>`).join("") +
      `</div><button class="btn" id="cast" disabled>Ez a tippem</button>`;
    app.querySelectorAll(".grid .c").forEach(e => e.onclick = () => { sel = +e.dataset.j; app.querySelectorAll(".grid .c").forEach(x => x.classList.toggle("on", x === e)); $("#cast").disabled = false; });
    $("#cast").onclick = () => { V.guess = sel; V.outcome = roleOf(sel) === "S" ? "evil" : "good"; V.stage = "guessed"; save(); voteFlow(); };
  } else if (V.stage === "guessed") {
    const ok = V.outcome === "evil";
    app.innerHTML = `<div class="center flip">${pimg(S, P.ch[V.guess], {cls: "pfp"})}</div><p class="big">${esc(S.chars[P.ch[V.guess]].name)}</p>
      <p class="big" style="color:${ok ? "var(--red)" : "var(--green)"}">${ok ? "Eltalálta a szemtanút! A gonoszok nyertek!" : "Nem ő a szemtanú. Az ártatlanok nyertek!"}</p><button class="btn" id="fin">Megoldás és szerepek</button>`;
    tone(ok ? 160 : 660, 1.2, "triangle", .3);
    $("#fin").onclick = () => { V.stage = "final"; save(); voteFlow(); };
  } else {
    let h = `<p class="big" style="color:${V.outcome === "good" ? "var(--green)" : "var(--red)"}">${V.outcome === "good" ? "Az ártatlanok nyertek!" : "A gonoszok nyertek!"}</p>
      <div class="panel"><h3>Mi történt valójában</h3><p>${esc(S.solution)}</p></div><h3>Ki kicsoda volt</h3><div class="grid">`;
    P.ch.forEach((sl, j) => { const c = S.chars[sl], ev = c.role === "G" || c.role === "B"; h += `<div class="c">${pimg(S, sl, {evil: ev})}<b>${esc(c.name)}</b><br>${esc(P.n[j])}<br><span class="badge ${ev ? "red" : c.role === "S" ? "blue" : ""}">${c.roleName}</span></div>`; });
    h += `</div><div class="panel"><h3>Titkos küldetések</h3><p class="small muted">Meséljétek el, kinek sikerült!</p>` +
      P.ch.map((sl, j) => `<p class="small"><b>${esc(P.n[j])}</b> (${esc(S.chars[sl].name)}): ${esc(S.chars[sl].mission)}</p>`).join("") +
      `</div><button class="btn" id="new">Új játék</button>`;
    app.innerHTML = h;
    $("#new").onclick = () => { location.hash = ""; location.reload(); };
  }
  window.scrollTo(0, 0);
}

/* ===================== router ===================== */
function route() {
  const m = location.hash.match(/^#c=(.+)$/);
  if (m) startGame(m[1]); else lobby();
}
window.addEventListener("hashchange", () => location.reload());
route();
</script>
</body>
</html>
